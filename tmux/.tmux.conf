# ~/.tmux.conf (tracked in ~/dotfiles). Prefix is the default Ctrl-b; reload with prefix + r.

# ---- terminal ----
set -g default-terminal "tmux-256color"
set -ga terminal-features "*:RGB"   # true colour, so nvim themes look right
set -g default-shell /bin/bash
set -sg escape-time 10              # Esc in nvim without the default half-second lag
set -g focus-events on              # nvim notices files changed outside it (e.g. by Claude)
set -g history-limit 50000

# ---- mouse & copying ----
set -g mouse on
setw -g mode-keys vi                # copy mode (prefix + [) uses vim keys: v to select, y to copy
set -g set-clipboard on
# y and mouse-drag copy to the system clipboard: wl-copy on Wayland, xclip on X11
if-shell '[ -n "$WAYLAND_DISPLAY" ]' 'set -s copy-command "wl-copy"' 'set -s copy-command "xclip -selection clipboard"'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ---- windows & panes ----
set -g base-index 1                 # number windows from 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
set -g pane-border-status top
bind '"' split-window -v -c "#{pane_current_path}"   # new splits and windows open in the current folder
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
